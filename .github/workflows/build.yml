name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository. The release job below raises this for itself.
permissions:
  contents: read

# A newer push to the same ref cancels the older run. Tag runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   runner: ubuntu-24.04,     os: linux,   arch: x86_64,  archive: tar.gz }
          - { name: linux-arm64,    runner: ubuntu-24.04-arm, os: linux,   arch: arm64,   archive: tar.gz }
          - { name: macos-arm64,    runner: macos-14,         os: macos,   arch: arm64,   archive: tar.gz }
          - { name: windows-x86_64, runner: windows-2022,     os: windows, arch: x86_64,  archive: zip }
    env:
      CONFIG: Release
      PACKAGE: coyote-${{ matrix.os }}-${{ matrix.arch }}-Release
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Toolchain versions
        run: |
          cmake --version
          git --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${CONFIG} -DCOYOTE_WARNINGS_AS_ERRORS=ON -DCOYOTE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config ${CONFIG} --parallel

      - name: Install
        run: cmake --install build --config ${CONFIG} --prefix "dist/${PACKAGE}"

      - name: Package
        run: |
          set -eu
          mkdir -p out
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cmake -E tar cf "../out/${PACKAGE}.zip" --format=zip "${PACKAGE}"
          else
            tar -czf "../out/${PACKAGE}.tar.gz" "${PACKAGE}"
          fi
          cd ..
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.PACKAGE }}
          path: out/${{ env.PACKAGE }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  vscode-extension:
    name: VS Code extension (vsix)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: editors/vscode
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"

      - name: Package
        run: npx --yes @vscode/vsce@3.2.1 package --allow-missing-repository --skip-license -o coyote-vscode.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coyote-vscode-extension
          path: editors/vscode/coyote-vscode.vsix
          if-no-files-found: error
          retention-days: 30

  windows-installer:
    name: Windows installer (Coyote Studio + setup.exe)
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CONFIG: Release
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"

      - name: Version
        id: ver
        run: |
          node tools/version.js check
          full="$(node tools/version.js full ${{ github.run_number }})"
          echo "full=${full}" >> "$GITHUB_OUTPUT"
          echo "Installer version: ${full}"

      - name: Build the toolchain (static CRT, no VC++ redistributable needed)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${CONFIG} -DCOYOTE_WARNINGS_AS_ERRORS=ON -DCOYOTE_BUILD_TESTS=OFF
          cmake --build build --config ${CONFIG} --parallel

      - name: Studio - install packages
        working-directory: studio
        run: npm ci

      - name: Studio - package CoyoteStudio.exe
        working-directory: studio
        run: >
          npm run package:win --
          --icon=build/icon.ico --app-version="${{ steps.ver.outputs.full }}"
          --win32metadata.CompanyName="Coyote" --win32metadata.ProductName="Coyote Studio"
          --win32metadata.FileDescription="Coyote Studio"

      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@3.2.1 package --allow-missing-repository --skip-license -o coyote-vscode.vsix

      - name: Download clang for native builds (llvm-mingw)
        shell: bash
        run: |
          set -eu
          ver=20241030
          curl -fsSL -o llvm-mingw.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/${ver}/llvm-mingw-${ver}-ucrt-x86_64.zip"
          unzip -q llvm-mingw.zip -d llvm-extract
          mv llvm-extract/llvm-mingw-* clang-dir
          # only x86_64 programs are built: drop the other targets to keep the installer smaller
          rm -rf clang-dir/armv7-w64-mingw32 clang-dir/aarch64-w64-mingw32 clang-dir/i686-w64-mingw32
          rm -f clang-dir/bin/*armv7* clang-dir/bin/*aarch64* clang-dir/bin/*i686*
          ls clang-dir/bin | head -30
          test -f clang-dir/bin/x86_64-w64-mingw32-clang.exe

      - name: Stage installer contents
        env:
          COYOTE_CLANG_DIR: ${{ github.workspace }}/clang-dir
        run: bash tools/stage.sh build/${CONFIG} studio/dist/CoyoteStudio-win32-x64 stage editors/vscode/coyote-vscode.vsix

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y --version=6.3.3

      - name: Build setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.full }}" "/DStageDir=$PWD\stage" "/DOutDir=$PWD\setup-out" installer\coyote.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem setup-out

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coyote-setup
          path: setup-out/Coyote-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, vscode-extension, windows-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # needed to create the release and attach files
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: release-files
          merge-multiple: true

      - name: Checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" release-files/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Coyote ${TAG}" \
            --generate-notes
